name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Generate Gradle wrapper files
        run: gradle -p android-app wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Build debug APK with the wrapper
        working-directory: android-app
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vidhisetu-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      # Persist wrapper artifacts generated by the successful CI build so a fresh
      # clone can use ./gradlew without a missing gradle-wrapper.jar error.
      - name: Commit Gradle wrapper files to main
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add android-app/gradlew android-app/gradlew.bat android-app/gradle/wrapper/gradle-wrapper.jar android-app/gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add Gradle wrapper JAR for local builds"
            git push
          fi
