# Project-wide Gradle settings.
# AndroidX is required by AppCompat, Material and core-ktx.
android.useAndroidX=true

# JVM settings for a reproducible CI and local build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Disabled until the Android build is stable; configuration-cache serialization
# can fail inside Android data-binding tasks before dependency issues are fixed.
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.incremental.useClasspathSnapshot=true
